<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Intentions Charity Organisation</title>
    
    #google fonts: Montessart 
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    #tailwindcss    
    <script src="https://cdn.tailwindcss.com"></script>
    
    #react and reactDOM
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    #babel for JSX transformation
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    #tailwind configuration for custom colors and font update
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        amber: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            200: '#fde68a',
                            300: '#fcd34d',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                            800: '#92400e',
                            900: '#78350f',
                        }
                    },
                    fontFamily: {
                        sans: ['"Montserrat"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
                        serif: ['Georgia', 'Cambria', '"Times New Roman"', 'Times', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        html { scroll-behavior: smooth; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeInSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeInSlideUp {
            animation: fadeInSlideUp 0.8s ease-out forwards;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .swirly-underline {
            position: relative;
            display: inline-block;
            padding-bottom: 8px; 
            cursor: default;
        }

        .swirly-underline::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px; 
            background: linear-gradient(90deg, #f59e0b, #d97706); 
            border-radius: 9999px; 
            transform: scaleX(0); 
            transform-origin: bottom left;
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .heading-group:hover .swirly-underline::after {
            transform: scaleX(1); 
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        body { overflow-x: hidden; width: 100%; }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-white text-gray-700 antialiased selection:bg-amber-200 selection:text-amber-900">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconBase = ({ size = 24, className = "", children, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const Heart = (props) => <IconBase {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" /></IconBase>;
        const Droplets = (props) => <IconBase {...props}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.35"/></IconBase>;
        const BookOpen = (props) => <IconBase {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></IconBase>;
        const Users = (props) => <IconBase {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>;
        const ArrowRight = (props) => <IconBase {...props}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconBase>;
        const CheckCircle = (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>;
        const Globe = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1-4 10z"/></IconBase>;
        const Phone = (props) => <IconBase {...props}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></IconBase>;
        const Mail = (props) => <IconBase {...props}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></IconBase>;
        const ChevronRight = (props) => <IconBase {...props}><path d="m9 18 6-6-6-6"/></IconBase>;
        const Facebook = (props) => <IconBase {...props}><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></IconBase>;
        const Twitter = (props) => <IconBase {...props}><path d="M22 4s-.7 2.1-2 3.4c1.6 10-94 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/></IconBase>;
        const Instagram = (props) => <IconBase {...props}><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></IconBase>;
        const Linkedin = (props) => <IconBase {...props}><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></IconBase>;
        const Camera = (props) => <IconBase {...props}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></IconBase>;
        const X = (props) => <IconBase {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>;
        const Zap = (props) => <IconBase {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></IconBase>;
        const Landmark = (props) => <IconBase {...props}><line x1="3" x2="21" y1="22" y2="22"/><path d="M6 18v-4c0-1.1.9-2 2-2h8c1.1 0 2 .9 2 2v4"/><path d="m20 10-8-7-8 7"/></IconBase>;
        const Target = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></IconBase>;
        const Smartphone = (props) => <IconBase {...props}><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></IconBase>;

        const Button = ({ children, variant = 'primary', className = '', onClick, type = "button" }) => {
            const baseStyles = "inline-flex items-center justify-center px-6 py-3 rounded-full font-bold transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed tracking-wide";
            const variants = {
                primary: "bg-gradient-to-r from-amber-500 to-yellow-600 text-white hover:from-amber-600 hover:to-yellow-700 shadow-lg shadow-amber-500/40 border border-transparent",
                secondary: "bg-white text-amber-900 border-2 border-amber-200 hover:border-amber-500 hover:text-amber-700 hover:bg-amber-50 focus:ring-amber-500",
                outline: "bg-transparent border-2 border-yellow-400 text-yellow-400 hover:bg-yellow-400 hover:text-black focus:ring-yellow-400",
                ghost: "bg-transparent text-amber-700 hover:bg-amber-100 focus:ring-amber-500"
            };

            return (
                <button type={type} className={`${baseStyles} ${variants[variant]} ${className}`} onClick={onClick}>
                    {children}
                </button>
            );
        };

        const Badge = ({ children }) => (
            <span className="inline-flex items-center px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-amber-100 text-amber-800 border border-amber-200 mb-6 shadow-sm">
                {children}
            </span>
        );

        const SectionHeading = ({ title, subtitle, center = true }) => (
            <div className={`mb-10 md:mb-16 ${center ? 'text-center' : ''} heading-group px-4`}>
                <h2 className="text-3xl md:text-5xl font-bold text-gray-900 mb-4 md:mb-6 font-sans tracking-tight inline-block swirly-underline">
                    {title}
                </h2>
                <div className="mb-6 md:mb-8"></div>
                {subtitle && <p className="text-lg md:text-xl text-gray-600 max-w-3xl mx-auto leading-relaxed font-light">{subtitle}</p>}
            </div>
        );

        const WhyUsSection = () => (
            <div className="container mx-auto px-4 md:px-6 pt-16 md:pt-24 pb-12">
                <SectionHeading 
                    title="Why Pure Intentions?" 
                    subtitle="Our commitment to transparency, direct action, and sustainable growth sets us apart in the non-profit world." 
                />
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-10 mt-12 md:mt-16">
                    <div className="p-6 md:p-8 bg-white rounded-3xl shadow-2xl shadow-amber-50/50 border border-amber-100/50 text-center hover:shadow-amber-100 transition-shadow duration-300">
                        <div className="w-14 h-14 md:w-16 md:h-16 mx-auto bg-amber-100 rounded-full flex items-center justify-center mb-6 border-4 border-amber-200">
                            <Globe size={28} className="text-amber-600" />
                        </div>
                        <h3 className="text-xl font-bold text-gray-900 mb-3 font-sans">100% Transparency</h3>
                        <p className="text-gray-600 leading-relaxed text-sm md:text-base">Every shilling donated goes directly to field programs. Our administrative costs are covered entirely by separate grants.</p>
                    </div>
                    <div className="p-6 md:p-8 bg-white rounded-3xl shadow-2xl shadow-amber-50/50 border border-amber-100/50 text-center hover:shadow-amber-100 transition-shadow duration-300">
                        <div className="w-14 h-14 md:w-16 md:h-16 mx-auto bg-amber-100 rounded-full flex items-center justify-center mb-6 border-4 border-amber-200">
                            <Users size={28} className="text-amber-600" />
                        </div>
                        <h3 className="text-xl font-bold text-gray-900 mb-3 font-sans">Community-Led</h3>
                        <p className="text-gray-600 leading-relaxed text-sm md:text-base">We work hand-in-hand with local Ugandan leaders and residents to design and implement sustainable solutions.</p>
                    </div>
                    <div className="p-6 md:p-8 bg-white rounded-3xl shadow-2xl shadow-amber-50/50 border border-amber-100/50 text-center sm:col-span-2 lg:col-span-1 hover:shadow-amber-100 transition-shadow duration-300">
                        <div className="w-14 h-14 md:w-16 md:h-16 mx-auto bg-amber-100 rounded-full flex items-center justify-center mb-6 border-4 border-amber-200">
                            <CheckCircle size={28} className="text-amber-600" />
                        </div>
                        <h3 className="text-xl font-bold text-gray-900 mb-3 font-sans">Long-Term Impact</h3>
                        <p className="text-gray-600 leading-relaxed text-sm md:text-base">Our projects focus on education and clean infrastructure, ensuring lasting change beyond initial aid delivery.</p>
                    </div>
                </div>
            </div>
        );

        const MissionPrinciplesSection = () => {
            const principles = [
                { icon: Target, title: "Precision Focus", description: "Targeting aid efficiently by focusing on sustainable infrastructure and education in underserved Ugandan villages." },
                { icon: Zap, title: "Zero Overhead", description: "Guaranteeing that 100% of public donations are utilized directly in the field, with admin costs covered by grants." },
                { icon: Globe, title: "Local Ownership", description: "Ensuring all projects are collaboratively designed, implemented, and managed by local community leaders for lasting self-reliance." },
            ];
            
            return (
                <div className="py-16 md:py-20 bg-amber-50/70 border-t border-b border-amber-100/50">
                    <div className="container mx-auto px-4 md:px-6">
                        <div className="grid lg:grid-cols-2 gap-10 md:gap-12 items-center">
                            <div>
                                <Badge>Our Foundation</Badge>
                                <h2 className="text-3xl md:text-4xl font-bold text-gray-900 mb-6 font-sans">Our Vision</h2>
                                <p className="text-gray-700 text-base md:text-lg mb-6 leading-relaxed">
                            To become a leading provider of quality Education, transforming the lives of needy individuals and creating a sustainable,educated and self-sufficent community.
                                </p>
                                <p className="text-gray-600 mb-8 leading-relaxed italic border-l-4 border-amber-400 pl-4">
                                    PICO
                                </p>
                            </div>
                            
                            <div className="space-y-4 md:space-y-6">
                                {principles.map((p, index) => (
                                    <div key={index} className="flex flex-col sm:flex-row items-start gap-4 p-5 md:p-6 bg-white rounded-2xl shadow-lg border border-amber-100 hover:shadow-amber-200/50 transition-shadow">
                                        <div className="p-3 rounded-full bg-amber-100 flex-shrink-0">
                                            <p.icon size={24} className="text-amber-600" />
                                        </div>
                                        <div>
                                            <h3 className="text-lg md:text-xl font-bold text-gray-900 mb-1 font-sans">{p.title}</h3>
                                            <p className="text-gray-600 text-sm md:text-base">{p.description}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const TestimonialSection = () => (
            <div className="py-12 md:py-16 bg-white">
                <div className="container mx-auto px-4 md:px-6">
                    <SectionHeading 
                        title="Director's Message" 
                        subtitle="Hear directly from our Executive Director." 
                    />
                    <div className="max-w-4xl mx-auto bg-amber-900 text-white rounded-[2rem] shadow-2xl shadow-amber-900/30 p-6 md:p-10 relative overflow-hidden">
                        <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
                        <div className="relative z-10 flex flex-col md:flex-row items-center gap-6">
                            <div className="flex-shrink-0">
                                <img 
                                    src="Nimwampaire Hillary Director.jpg" 
                                    alt="Sarah Auma" 
                                    className="w-20 h-20 md:w-32 md:h-32 rounded-full object-cover border-4 border-amber-500 shadow-xl" 
                                />
                            </div>
                            <div className="text-center md:text-left animate-fadeInSlideUp" style={{ animationDelay: '0.2s' }}>
                                <blockquote className="text-lg md:text-2xl font-light italic leading-snug mb-4 border-l-0 md:border-l-4 border-amber-400 md:pl-4">
 "At Pure Intentions Charity Organisation, we believe that every child deserves a fair chance to learn, dream, and thrive. Guided by Sustainable Development Goal 4—Quality Education—we are committed to supporting children from underprivileged homes, broken families, orphans, and those living with chronic illnesses such as HIV/AIDS through life-changing scholarship opportunities.
Our success is not an individual achievement, but a collective victory. It takes a community to lift a child, and together, we can elevate the marginalized and break the cycles of inequality.
Thank you for joining us in turning hope into opportunity."

                                </blockquote>
                                <div className="font-bold text-lg text-amber-300"></div>
                                <div className="text-amber-100 text-[10px] md:text-xs uppercase tracking-wide"></div>
                            </div>
                        </div>
                        <Heart size={64} className="absolute -bottom-2 -right-2 md:bottom-4 md:right-4 text-amber-700/30 fill-amber-800/20" />
                    </div>
                </div>
            </div>
        );

        const PartnershipLogos = () => {
            const logos = [
                { name: 'Solidarity Fund', style: 'font-extrabold text-lg tracking-wider' },
                            ];

            return (
                <div className="container mx-auto px-6 py-12">
                    <p className="text-center text-gray-500 text-[10px] md:text-sm font-bold uppercase tracking-widest mb-10">Trusted By Organizations Worldwide</p>
                    <div className="flex flex-wrap items-center justify-center gap-x-8 md:gap-x-12 gap-y-8 opacity-70">
                        {logos.map((logo, index) => (
                            <div key={index} className={`text-gray-400 hover:text-amber-600 transition-colors duration-300 ${logo.style}`}>
                                {logo.name}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const HomeView = ({ onDonate }) => {
            const heroImages = [
                "hero1.jpeg", 
                "hero2.jpeg", 
                "hero3.jpeg",
                "hero4.jpeg" 
            ];

            const [currentImageIndex, setCurrentImageIndex] = useState(0);

            useEffect(() => {
                const interval = setInterval(() => {
                    setCurrentImageIndex((prevIndex) => (prevIndex + 1) % heroImages.length);
                }, 4000); 
                return () => clearInterval(interval);
            }, []);

            return (
                <section className="relative overflow-hidden w-full">
                    <div className="relative min-h-[90vh] md:min-h-screen flex items-center justify-center overflow-hidden animate-in fade-in duration-500">
                        <div className="absolute inset-0 z-0">
                            {heroImages.map((img, index) => (
                                <div 
                                    key={index}
                                    className={`absolute inset-0 transition-opacity duration-1000 ease-in-out ${index === currentImageIndex ? 'opacity-100' : 'opacity-0'}`}
                                >
                                    <img src={img} alt="" className="w-full h-full object-cover" />
                                </div>
                            ))}
                            <div className="absolute inset-0 bg-gradient-to-r from-amber-900/90 via-amber-800/70 to-amber-700/50 z-10"></div>
                        </div>

                        <div className="container mx-auto px-4 md:px-6 relative z-20 text-center pt-24 md:pt-40 pb-16">
                            <div className="max-w-5xl mx-auto">
                                <h1 className="text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-bold text-white mb-6 leading-tight font-sans drop-shadow-lg animate-float">
                                    Pure Intentions Charity Organisation
                                    <span className="block text-xl sm:text-3xl md:text-4xl font-light mt-3 text-amber-200">
                                        Turning Compassion Into Golden Action
                                    </span>
                                </h1>
                                <p className="text-base sm:text-lg md:text-xl text-amber-50 mb-10 leading-relaxed max-w-2xl mx-auto font-light border-l-4 border-amber-500 pl-4 md:pl-6 text-left md:text-center">
                                    We believe in a world where every person has access to life's basic necessities. Join Pure Intentions in our mission to restore hope.
                                </p>
                                <div className="flex justify-center">
                                    <Button onClick={onDonate} className="h-14 px-8 text-lg w-full sm:w-auto">Donate Now</Button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <WhyUsSection />
                    <MissionPrinciplesSection />
                    <TestimonialSection />
                    <PartnershipLogos />

                    <div className="bg-amber-800 py-12 md:py-16 my-12 mb-24 relative overflow-hidden">
                        <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
                        <div className="container mx-auto px-6 relative z-10 flex flex-col md:flex-row items-center justify-between gap-8 text-center md:text-left">
                            <h2 className="text-2xl md:text-4xl font-bold text-white max-w-2xl leading-snug">
                                Ready to make a real, verifiable difference in a child's future?
                            </h2>
                            <Button onClick={onDonate} className="flex-shrink-0 h-16 px-10 text-xl !bg-white !text-amber-800 hover:!bg-gray-100 shadow-lg border-none w-full md:w-auto">
                                Donate Today
                            </Button>
                        </div>
                    </div>
                </section>
            );
        };

        const PictorialView = ({ images }) => (
            <section className="bg-amber-50 animate-in slide-in-from-bottom-4 duration-500 pt-40 md:pt-40 pb-24 md:pb-32 w-full">
                <div className="container mx-auto px-4 md:px-6">
                    <SectionHeading title="Our Journey in Pictures" subtitle="Witness the smiles, the growth, and the incredible impact your support creates." />
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                        {images.map((image, index) => (
                            <div key={index} className="relative overflow-hidden rounded-2xl shadow-lg group aspect-square cursor-pointer border-4 border-amber-50 hover:border-amber-300 transition-colors">
                                <img src={image} alt="" className="w-full h-full object-cover transform transition-transform duration-700 group-hover:scale-110" />
                                <div className="absolute inset-0 bg-amber-900/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 backdrop-blur-[2px]">
                                    <div className="text-white text-center p-4">
                                        <div className="w-12 h-12 md:w-16 md:h-16 bg-white/20 backdrop-blur rounded-full flex items-center justify-center mx-auto mb-4">
                                            <Camera className="text-white" size={24} />
                                        </div>
                                        <p className="font-bold font-sans text-lg md:text-xl">View Gallery</p>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const TeamView = ({ members }) => (
            <section className="bg-white animate-in slide-in-from-bottom-4 duration-500 pt-40 md:pt-40 pb-24 md:pb-32 w-full">
                <div className="container mx-auto px-4 md:px-6">
                    <SectionHeading title="Meet Our Dedicated Team" subtitle="Behind every success story is a team of passionate individuals committed to our mission." />
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-8 gap-y-12">
                        {members.map((member, index) => (
                            <div key={index} className="flex flex-col group">
                                <div className="w-full aspect-square rounded-2xl overflow-hidden mb-5 shadow-sm border border-gray-100 bg-gray-50">
                                    <img 
                                        src={member.image} 
                                        alt={member.name} 
                                        className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" 
                                    />
                                </div>
